<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17815a"><title>آدرس‌ها | سودانه</title><style>@font-face{font-family:IRANSansXFaNum;src:local("IRANSansXFaNum"),local("IRANSansX FaNum");font-style:normal;font-weight:100 900;font-display:swap}:root{--font:IRANSansXFaNum,IRANSansX,IRANSans,Vazirmatn,Tahoma,Arial,sans-serif;--green:#17815a;--text:#2a3b33;--muted:#7b8982;--line:#e0e8e3;--pale:#eff8f3}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#fff;color:var(--text);font-family:var(--font);font-variant-numeric:proportional-nums}button{font:inherit}.app{width:100%;max-width:430px;min-height:max(100dvh,844px);margin:auto;padding:14px 16px 88px;background:#fff}.top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:19px}.top h1{margin:0;text-align:center;font-size:16px;font-weight:600}.back{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:#506459;font-family:Arial,sans-serif;font-size:21px;text-decoration:none}.address-list{display:grid;gap:10px}.address-card{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.address-top{display:flex;align-items:center;gap:8px}.pin{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto;border-radius:8px;background:#e7f5ed;color:var(--green)}.pin svg{width:16px;height:16px}.address-top strong{min-width:0;flex:1;color:#344b3f;font-size:11px;font-weight:600}.default{padding:3px 6px;border-radius:5px;background:#17815a16;color:var(--green);font-size:8px}.address-card p{margin:10px 0 0;color:#78867e;font-size:10px;line-height:1.9}.address-card small{display:block;margin-top:5px;color:#929d98;font-size:8px}.address-actions{display:flex;gap:7px;margin-top:12px}.address-actions button{height:28px;padding:0 9px;border:0;border-radius:7px;background:#f2f6f3;color:#5c7367;font-size:9px;cursor:pointer}.address-actions button.edit{background:#17815a18;color:var(--green)}.add-address{position:fixed;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),398px);height:46px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:600;cursor:pointer}.sheet{position:fixed;z-index:8;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#19382b3d}.sheet[hidden]{display:none}.sheet-content{width:min(100%,430px);padding:9px 16px max(20px,env(safe-area-inset-bottom));border-radius:18px 18px 0 0;background:#fff}.handle{display:block;width:34px;height:4px;margin:0 auto 15px;border-radius:4px;background:#dce4df}.sheet-content h2{margin:0;font-size:14px;font-weight:600}.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}.field label{font-size:10px;font-weight:500}.field input{height:44px;border:1px solid var(--line);border-radius:8px;outline:0;padding:0 10px;font-family:var(--font);font-size:11px}.save{width:100%;height:43px;margin-top:16px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:600;cursor:pointer}@media(min-width:431px){body{min-height:100vh;background:#f3f5f4}.app{border-left:1px solid #e9eeeb;border-right:1px solid #e9eeeb}}.back svg{width:18px;height:18px}.top-ad-strip{position:relative;z-index:60;display:block;width:min(100%,430px);height:60px;margin:0 auto;overflow:hidden;background:#0e704d;line-height:0;text-decoration:none}.top-ad-strip img{display:block;width:100%;height:60px;object-fit:cover;object-position:center}.top{position:sticky;top:0;z-index:55;isolation:isolate;background:#fff;box-shadow:0 4px 10px #18372608}</style></head><body><a class="top-ad-strip" href="sodaneh-special.html" aria-label="مشاهده تخفیف‌های ویژه"><img src="assets/promotions/top-promo.gif" alt="تخفیف ویژه تا ۳۰ درصد و پاداش خرید"></a><main class="app"><header class="top"><a class="back" href="sodaneh-account.html" aria-label="بازگشت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 5 7 7-7 7"/></svg></a><h1>آدرس‌ها</h1><span></span></header><section class="address-list"><article class="address-card"><div class="address-top"><span class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 10c0 5-7 10-7 10s-7-5-7-10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg></span><strong>خانه</strong><span class="default">پیش‌فرض</span></div><p>تهران، سعادت‌آباد، بلوار دریا، خیابان صراف‌ها، پلاک ۲۴، واحد ۷</p><small>گیرنده: مریم احمدی · ۰۹۱۲ ۱۲۳ ۴۵۶۷</small><div class="address-actions"><button class="edit" type="button">ویرایش</button><button type="button">حذف</button></div></article><article class="address-card"><div class="address-top"><span class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 10c0 5-7 10-7 10s-7-5-7-10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg></span><strong>محل کار</strong></div><p>تهران، ونک، خیابان ملاصدرا، کوچه شاد، پلاک ۸</p><small>گیرنده: مریم احمدی · ۰۹۱۲ ۱۲۳ ۴۵۶۷</small><div class="address-actions"><button class="edit" type="button">ویرایش</button><button type="button">حذف</button><button type="button">پیش‌فرض کردن</button></div></article></section></main><button id="add-address" class="add-address" type="button">+ افزودن آدرس جدید</button><div id="address-sheet" class="sheet" hidden><section class="sheet-content"><span class="handle"></span><h2>آدرس جدید</h2><div class="field"><label>استان و شهر</label><input placeholder="مثلاً تهران، تهران"></div><div class="field"><label>آدرس کامل</label><input placeholder="خیابان، کوچه، پلاک و واحد"></div><div class="field"><label>کد پستی</label><input inputmode="numeric" placeholder="۱۰ رقم"></div><button id="save-address" class="save" type="button">ذخیره آدرس</button></section></div><script>const sheet=document.getElementById('address-sheet'),sheetTitle=sheet.querySelector('h2');const openSheet=title=>{sheetTitle.textContent=title;sheet.hidden=false};document.getElementById('add-address').onclick=()=>openSheet('آدرس جدید');sheet.onclick=e=>{if(e.target===sheet)sheet.hidden=true};document.querySelectorAll('.address-actions').forEach(actions=>actions.querySelectorAll('button').forEach(button=>button.onclick=()=>{const card=actions.closest('.address-card');if(button.classList.contains('edit')){openSheet('ویرایش آدرس');return}if(button.textContent.includes('حذف')){card.style.opacity='.45';setTimeout(()=>card.remove(),180);return}document.querySelectorAll('.address-card .default').forEach(tag=>tag.remove());const badge=document.createElement('span');badge.className='default';badge.textContent='پیش‌فرض';card.querySelector('.address-top').append(badge);button.remove()}));document.getElementById('save-address').onclick=e=>{e.target.textContent='✓ آدرس ذخیره شد';setTimeout(()=>{sheet.hidden=true;e.target.textContent='ذخیره آدرس'},700)};</script></body></html>
