<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17815a"><title>اطلاعات شخصی | سودانه</title><style>@font-face{font-family:IRANSansXFaNum;src:local("IRANSansXFaNum"),local("IRANSansX FaNum");font-style:normal;font-weight:100 900;font-display:swap}:root{--font:IRANSansXFaNum,IRANSansX,IRANSans,Vazirmatn,Tahoma,Arial,sans-serif;--green:#17815a;--text:#2a3b33;--muted:#7b8982;--line:#e0e8e3;--pale:#eff8f3}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#fff;color:var(--text);font-family:var(--font);font-variant-numeric:proportional-nums}button,input{font:inherit}.app{width:100%;max-width:430px;min-height:max(100dvh,844px);margin:auto;padding:14px 16px 30px;background:#fff}.top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:23px}.top h1{margin:0;text-align:center;font-size:16px;font-weight:600}.back{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:#506459;font-family:Arial,sans-serif;font-size:21px;text-decoration:none}.profile-note{display:flex;align-items:center;gap:9px;padding:11px;border-radius:9px;background:var(--pale);color:#648072;font-size:9px;line-height:1.8}.profile-note span{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#dcefe4;color:var(--green);font-size:15px}.form{display:grid;gap:15px;margin-top:23px}.field{display:flex;flex-direction:column;gap:7px}.field label{color:#465c51;font-size:11px;font-weight:500}.field label small{margin-right:4px;color:#98a39e;font-size:9px;font-weight:400}.field input{height:48px;border:1px solid var(--line);border-radius:9px;outline:0;background:#fff;padding:0 11px;color:#30453a;font-size:12px}.field input:focus{border-color:var(--green)}.field input:disabled{background:#f7f8f8;color:#89958f}.field input::placeholder{color:#b1bbb6;font-weight:300}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{height:47px;margin-top:8px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:11px;font-weight:600;cursor:pointer}.save.saved{background:#0f6847}.privacy{margin:15px 2px 0;color:#919b96;font-size:9px;line-height:1.9}@media(min-width:431px){body{min-height:100vh;background:#f3f5f4}.app{border-left:1px solid #e9eeeb;border-right:1px solid #e9eeeb}}.back svg{width:18px;height:18px}.top-ad-strip{position:relative;z-index:60;display:block;width:min(100%,430px);height:60px;margin:0 auto;overflow:hidden;background:#0e704d;line-height:0;text-decoration:none}.top-ad-strip img{display:block;width:100%;height:60px;object-fit:cover;object-position:center}.top{position:sticky;top:0;z-index:55;isolation:isolate;background:#fff;box-shadow:0 4px 10px #18372608}</style></head><body><a class="top-ad-strip" href="sodaneh-special.html" aria-label="مشاهده تخفیف‌های ویژه"><img src="assets/promotions/top-promo.gif" alt="تخفیف ویژه تا ۳۰ درصد و پاداش خرید"></a><main class="app"><header class="top"><a class="back" href="sodaneh-account.html" aria-label="بازگشت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 5 7 7-7 7"/></svg></a><h1>اطلاعات شخصی</h1><span></span></header><div class="profile-note"><span>i</span><p>اطلاعات هویتی برای ارسال مطمئن سفارش و تکمیل حساب کاربری استفاده می‌شود.</p></div><form id="profile-form" class="form"><div class="field"><label for="phone">شماره موبایل</label><input id="phone" value="۰۹۱۲ ۱۲۳ ۴۵۶۷" dir="ltr" disabled></div><div class="two"><div class="field"><label for="first">نام</label><input id="first" value="مریم" placeholder="نام"></div><div class="field"><label for="last">نام خانوادگی</label><input id="last" value="احمدی" placeholder="نام خانوادگی"></div></div><div class="field"><label for="birth">تاریخ تولد <small>اختیاری</small></label><input id="birth" placeholder="۱۳۷۵/۰۶/۲۱" inputmode="numeric"></div><div class="field"><label for="national">کد ملی <small>اختیاری</small></label><input id="national" placeholder="۰۱۲۳۴۵۶۷۸۹" inputmode="numeric" dir="ltr" maxlength="10"></div><button class="save" type="submit">ذخیره تغییرات</button></form><p class="privacy">با ثبت اطلاعات، مسئولیت صحت آن‌ها بر عهدهٔ کاربر است.</p></main><script>document.getElementById('profile-form').addEventListener('submit',e=>{e.preventDefault();const b=e.submitter;b.textContent='✓ تغییرات ذخیره شد';b.classList.add('saved')});</script></body></html>
