# ==============================================================================
# Soodaneh Multi-Domain Production Nginx Configuration
# ------------------------------------------------------------------------------
# 1. sodaneh.ir & www.sodaneh.ir -> Landing & Blog (Storefront Frontend: Port 3000)
# 2. app.sodaneh.ir               -> Customer Shopping App (Storefront Frontend: Port 3000)
# 3. dashboard.sodaneh.ir             -> Admin Dashboard (Admin Frontend: Port 4001)
# 4. api.sodaneh.ir               -> NestJS Backend API & Media Uploads (Port 4000)
# ==============================================================================

# Common Proxy Headers
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;

# ------------------------------------------------------------------------------
# 1. Main Landing & Blog: sodaneh.ir & www.sodaneh.ir
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sodaneh.ir www.sodaneh.ir;

    # For SSL (certbot --nginx will configure automatically, or uncomment below)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/sodaneh.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sodaneh.ir/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ------------------------------------------------------------------------------
# 2. Customer Shopping App: app.sodaneh.ir
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.sodaneh.ir;

    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/sodaneh.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sodaneh.ir/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ------------------------------------------------------------------------------
# 3. Admin Dashboard: dashboard.sodaneh.ir
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.sodaneh.ir;

    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/sodaneh.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sodaneh.ir/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ------------------------------------------------------------------------------
# 4. Backend NestJS API & Media Storage: api.sodaneh.ir
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sodaneh.ir;

    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/sodaneh.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sodaneh.ir/privkey.pem;

    client_max_body_size 50M;

    # API routes & Swagger documentation
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for SSE / live notification stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static media uploads cache
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
